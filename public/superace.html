<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Super Ace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08091a;color:#fff;font-family:Arial,sans-serif}
.game{width:min(100%,430px);min-height:100%;margin:auto;overflow:hidden;background:radial-gradient(ellipse at center,#12606a,#073d49 70%,#071525);padding-bottom:5px}
.top{height:72px;background:linear-gradient(#090b20,#15152b 65%,#4c1c0b);position:relative;text-align:center}
.close{position:absolute;left:12px;top:12px;border:0;background:transparent;color:#fff;font-size:26px;line-height:1}
.brand{position:absolute;bottom:5px;width:100%;font:bold 22px Georgia;color:#ffe8a4;text-shadow:0 2px #5d1b05,0 0 9px #ffae2b}
.multis{height:38px;width:78%;margin:-1px auto 0;position:relative;z-index:2;display:flex;justify-content:space-around;align-items:center;border:2px solid #ffe7a2;border-radius:24px;background:linear-gradient(#ffefb2,#e4a02a 58%,#a74c0b);box-shadow:0 0 12px #ffb82e}
.multi{border:0;background:transparent;color:#38200a;font-weight:900;font-size:17px;padding:5px 11px;border-radius:17px}
.multi.active{background:linear-gradient(#fff4b7,#ff9f16);color:#fff;text-shadow:0 1px #6b2a00;box-shadow:0 0 9px #fff4b0}
.stage{padding:8px 5px 4px;border-top:4px solid #c6b28c;border-bottom:3px solid #a56c32;background:linear-gradient(#6f9793 0,#07505b 14px,#063c49)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,min(17.5vw,74px));gap:3px;max-width:410px;margin:auto}
.tile{position:relative;overflow:hidden;border:1px solid #d4c18d;border-radius:5px;background:linear-gradient(145deg,#fffdf3,#d8e0e8);box-shadow:inset 0 0 0 2px #fff9e9,0 2px 4px #001e28;display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .2s}
.tile img{width:100%;height:100%;object-fit:contain;display:block;padding:1px}
.tile.dim{filter:brightness(.28) saturate(.65)}
.tile.win{z-index:4;border:2px solid #fff7bb;box-shadow:0 0 0 1px #ffcf3e,0 0 12px 5px #ffe15c,0 0 28px 10px rgba(255,170,25,.7);animation:winPulse .48s ease-in-out infinite alternate}
.tile.win:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,210,.85) 48%,transparent 63%);transform:translateX(-130%);animation:shineSweep .72s ease-in-out infinite}
.tile.drop{animation:cardDrop .48s cubic-bezier(.16,.78,.2,1) both}
@keyframes winPulse{from{filter:brightness(1.05)}to{filter:brightness(1.65)}}
@keyframes shineSweep{0%{transform:translateX(-130%);opacity:0}25%{opacity:1}100%{transform:translateX(130%);opacity:0}}
@keyframes cardDrop{0%{transform:translateY(-100%);opacity:.25}70%{transform:translateY(5%);opacity:1}100%{transform:translateY(0)}}
.status{height:27px;text-align:center;padding-top:6px;font:bold 12px Arial;color:#ffe7a4;text-shadow:0 1px #321}
.win-line{height:30px;text-align:center;color:#ffdf72;font:bold 18px Georgia}
.controls{min-height:88px;display:flex;align-items:center;justify-content:space-around;padding:5px 6px;background:linear-gradient(#06414c,#052d37 45%,#30160d 46%,#100b0b);border-top:2px solid #b48a50;gap:3px}
.ctrl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#f6dfa6;min-width:42px}
.round{width:29px;height:29px;border-radius:50%;border:1px solid #d7ad61;background:radial-gradient(circle at 35% 25%,#7d887e,#263d37);color:#fff1bd;font-size:17px;font-weight:900}
.bet-control{display:flex;flex-direction:row;gap:4px;align-items:center;min-width:105px}
.bet-value{min-width:38px;text-align:center;display:flex;flex-direction:column;gap:3px}
.bet-value small{font-size:9px;color:#f6dfa6}.bet-value b{font-size:13px;color:#fff}
.spin{width:62px;height:62px;flex:0 0 62px;border-radius:50%;border:4px solid #ffdf85;background:radial-gradient(circle at 35% 25%,#fff7b2,#ffc02b 48%,#a64a05);color:#672605;font-weight:1000;font-size:13px;box-shadow:0 0 0 3px #87400c,0 0 18px #ffb32a}
.spin:disabled,.round:disabled{opacity:.5}
.balance{text-align:center;background:#120b0b;padding:6px;color:#ffe2a0;font-size:12px}
.balance b{font-size:16px;color:white}
.note{text-align:center;background:#120b0b;color:#b8ad98;font-size:9px;padding:3px 0 8px}
@media(min-width:500px){.game{min-height:650px}.board{grid-template-rows:repeat(5,74px)}}
@media(prefers-reduced-motion:reduce){.tile.win,.tile.drop,.tile.win:after{animation:none}}
</style></head><body><main class="game">
<header class="top"><button class="close" type="button" onclick="parent.home()" aria-label="Back">×</button><div class="brand">SuperAce</div></header>
<div class="multis"><button class="multi active" data-x="1">×1</button><button class="multi" data-x="2">×2</button><button class="multi" data-x="3">×3</button><button class="multi" data-x="5">×5</button></div>
<section class="stage"><div class="board" id="board"></div></section>
<div class="status" id="status">কার্ড মিলিয়ে জিতুন</div><div class="win-line">WIN&nbsp; <span id="win">0.000</span></div>
<section class="controls">
 <div class="ctrl bet-control"><button class="round" id="betMinus" type="button">−</button><div class="bet-value"><small>BET</small><b id="bet">50</b></div><button class="round" id="betPlus" type="button">+</button></div>
 <div class="ctrl"><button class="spin" id="spin" type="button">✦<br>SPIN</button></div>
 <div class="ctrl"><button class="round" id="auto" type="button">⟳</button>Autoplay</div>
 <div class="ctrl"><button class="round" id="turbo" type="button">ϟ</button>Turbo</div>
</section>
<div class="balance">Main Balance&nbsp; <b id="balance">লোড হচ্ছে...</b></div><div class="note">Virtual credits only · no cash value</div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),gameId=new URLSearchParams(location.search).get('gameId')||'super-ace';
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const definitions={
 ace:{rank:'A',suit:'♠',name:'ACE',tone:'#153d69'},
 king:{rank:'K',suit:'♛',name:'KING',tone:'#a72b32'},
 queen:{rank:'Q',suit:'♦',name:'QUEEN',tone:'#8b2b63'},
 jack:{rank:'J',suit:'⚔',name:'JACK',tone:'#245e55'},
 spade:{rank:'10',suit:'♠',name:'SPADE',tone:'#172d49'},
 heart:{rank:'10',suit:'♥',name:'HEART',tone:'#b52b39'},
 diamond:{rank:'10',suit:'♦',name:'DIAMOND',tone:'#b85b20'},
 club:{rank:'10',suit:'♣',name:'CLUB',tone:'#23634d'},
 wild:{rank:'W',suit:'✦',name:'WILD',tone:'#a65b12'},
 scatter:{rank:'S',suit:'✹',name:'SCATTER',tone:'#8b3420'}
};
const art={};
function makeCard(id){
 const d=definitions[id]||definitions.ace,face=['ace','king','queen','jack'].includes(id),gold=id==='wild'||id==='scatter';
 const bg=gold?'#fff0b4':'#fffdf4',accent=gold?'#9a4a0c':d.tone;
 const center=face
  ? '<circle cx="256" cy="300" r="112" fill="#f7e6bd" stroke="'+accent+'" stroke-width="8"/><circle cx="256" cy="300" r="94" fill="none" stroke="#d3aa61" stroke-width="3"/><text x="256" y="348" text-anchor="middle" font-size="126" fill="'+accent+'" font-family="Georgia,serif">'+d.suit+'</text><path d="M155 175 L190 125 L220 160 L256 105 L292 160 L322 125 L357 175Z" fill="#d5a23f" stroke="'+accent+'" stroke-width="8"/><circle cx="190" cy="125" r="10" fill="#fff1a8"/><circle cx="256" cy="105" r="10" fill="#fff1a8"/><circle cx="322" cy="125" r="10" fill="#fff1a8"/>'
  : '<circle cx="256" cy="300" r="120" fill="#f6e6c6" stroke="#d2ad68" stroke-width="7"/><text x="256" y="365" text-anchor="middle" font-size="190" fill="'+accent+'" font-family="Georgia,serif">'+d.suit+'</text>';
 if(id==='wild'){} 
 return '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="680" viewBox="0 0 512 680"><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".52" stop-color="'+bg+'"/><stop offset="1" stop-color="#d9d2bd"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff2b0"/><stop offset=".5" stop-color="#d6a13b"/><stop offset="1" stop-color="#81501c"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect x="13" y="13" width="486" height="654" rx="28" fill="#16232d" opacity=".2" filter="url(#shadow)"/><rect x="10" y="10" width="492" height="660" rx="26" fill="url(#paper)" stroke="url(#gold)" stroke-width="13"/><rect x="27" y="27" width="458" height="626" rx="18" fill="none" stroke="'+accent+'" stroke-width="4"/><path d="M48 105 Q256 60 464 105 M48 575 Q256 620 464 575" fill="none" stroke="#c8a35e" stroke-width="3"/><text x="55" y="92" font-family="Georgia,serif" font-size="68" font-weight="bold" fill="'+accent+'">'+d.rank+'</text><text x="58" y="145" font-family="Georgia,serif" font-size="55" fill="'+accent+'">'+d.suit+'</text><g transform="translate(0 0)">'+center+'</g><text x="256" y="598" text-anchor="middle" font-family="Georgia,serif" font-size="43" font-weight="bold" letter-spacing="5" fill="'+accent+'">'+d.name+'</text><text x="455" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="58" fill="'+accent+'" transform="rotate(180 455 620)">'+d.suit+'</text><rect x="39" y="39" width="434" height="602" rx="14" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/></svg>';
}
Object.keys(definitions).forEach(id=>{art[id]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(makeCard(id));});
let balance=0,bet=50,chosenX=1,busy=false,auto=false,turbo=false;
const ids=Object.keys(definitions);
function randomBoard(){return Array.from({length:25},()=>ids[Math.floor(Math.random()*ids.length)]);}
function draw(grid,wins,drop){
 const hit=new Set(wins||[]);$('board').innerHTML='';
 grid.forEach((id,index)=>{
  const cell=document.createElement('div');cell.className='tile'+(hit.size&&!hit.has(index)?' dim':'')+(hit.has(index)?' win':'')+(drop&&drop.includes(index)?' drop':'');
  const img=document.createElement('img');img.src=art[id]||art.ace;img.alt=id;img.draggable=false;cell.appendChild(img);$('board').appendChild(cell);
 });
}
function update(){
 $('balance').textContent=fmt(balance);$('bet').textContent=String(bet);
 $('betMinus').disabled=busy||bet<=1;$('betPlus').disabled=busy||bet*chosenX>=1000000;
 document.querySelectorAll('.multi').forEach(b=>b.classList.toggle('active',Number(b.dataset.x)===chosenX));
}
async function request(path,body){
 const token=localStorage.getItem('tk777_token')||'';
 const response=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
 const raw=await response.text();let data;try{data=JSON.parse(raw)}catch(_){throw Error('সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি')}
 if(!response.ok)throw Error(data.error||'গেম চালু করা যায়নি');return data;
}
async function loadBalance(){
 try{const d=await request('/me');balance=Number(d.user.balance||0);update();draw(randomBoard())}
 catch(e){$('status').textContent=e.message;$('balance').textContent='Login required'}
}
function sendBalanceToParent(){
 try{parent.postMessage({type:'tk777-balance-update',balance:balance},location.origin)}catch(_){}
}
async function play(){
 if(busy)return;
 const stake=bet*chosenX;
 if(stake>1000000){$('status').textContent='সর্বোচ্চ বেট ১,০০,০০০';return}
 if(balance<stake){$('status').textContent='পর্যাপ্ত ব্যালেন্স নেই';auto=false;return}
 busy=true;auto=auto;$('spin').disabled=true;update();$('win').textContent='0.000';$('status').textContent='কার্ড ঘুরছে...';
 try{
  const result=await request('/play',{gameId:gameId,betAmount:bet,betMultiplier:chosenX});
  balance=Number(result.balance||0);update();sendBalanceToParent();
  if(!result.frames||!result.frames.length){draw(result.finalGrid||randomBoard());await sleep(turbo?160:420)}
  else{
   for(const frame of result.frames){
    draw(frame.grid,frame.wins||[],frame.type==='drop'?frame.drop||[]:[]);
    await sleep(turbo?(frame.type==='win'?240:150):(frame.type==='win'?650:380));
   }
   draw(result.finalGrid||randomBoard());
  }
  $('win').textContent=fmt(result.payout||0);
  $('status').textContent=Number(result.payout||0)>0?'WIN ×'+Number(result.multiplier||0).toFixed(2)+' · '+Number(result.cascadeCount||0)+' COMBO':'NO WIN · TRY AGAIN';
 }catch(e){$('status').textContent=e.message;try{const d=await request('/me');balance=Number(d.user.balance||0);update();sendBalanceToParent()}catch(_){}}
 finally{
  busy=false;$('spin').disabled=false;update();
  if(auto){await sleep(450);if(auto)play()}
 }
}
$('spin').addEventListener('click',()=>{auto=false;play()});
$('auto').addEventListener('click',()=>{if(busy)return;auto=!auto;$('auto').style.background=auto?'radial-gradient(circle,#ffe58a,#a65a08)':'';if(auto)play()});
$('turbo').addEventListener('click',()=>{turbo=!turbo;$('turbo').style.background=turbo?'radial-gradient(circle,#ffe58a,#a65a08)':''});
$('betMinus').addEventListener('click',()=>{if(busy)return;bet=Math.max(1,bet-10);update()});
$('betPlus').addEventListener('click',()=>{if(busy)return;bet=Math.min(Math.floor(1000000/chosenX),bet+10);update()});
document.querySelectorAll('.multi').forEach(button=>button.addEventListener('click',()=>{if(busy)return;chosenX=Number(button.dataset.x);bet=Math.min(bet,Math.floor(1000000/chosenX));update()}));
window.addEventListener('beforeunload',()=>{auto=false});
loadBalance();
})();
</script></body></html>
