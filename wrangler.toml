name = "tk777"
main = "worker.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tk777-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
SITE_NAME = "TK777"
# Set ADMIN_EMAIL and ADMIN_PASSWORD as Worker secrets before deployment.
